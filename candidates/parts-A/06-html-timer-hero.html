<!-- 00 상단 고정 타이머 바 -->
<header class="timer-bar" id="timerBar">
  <div class="wrap">
    <svg class="timer-badge" viewBox="0 0 200 200" aria-hidden="true"><use href="#tc-badge"/></svg>
    <div class="timer-text">
      <span class="timer-label" id="timerLabel"><span class="timer-label-short">첫 달 기장료 무료까지</span><span class="timer-label-long">첫 달 기장료 무료까지 남은 시간</span></span>
      <span class="timer-digits num" id="timerDigits" aria-hidden="true"><span class="d">2</span><span class="d">9</span><span class="c">:</span><span class="d">5</span><span class="d">9</span></span>
    </div>
    <span class="sr-only" aria-live="polite" id="timerLive">남은 시간 약 30분</span>
    <button class="timer-chip" id="timerChip" type="button" aria-label="쿠폰코드 복사">TC-0000</button>
    <a class="timer-kakao js-kakao" href="https://pf.kakao.com/_Mxojqs/chat" aria-label="카카오톡 상담"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-kakao"/></svg></a>
  </div>
  <div class="timer-line" id="timerLine" aria-hidden="true"></div>
</header>
